    serving: vLLM
    quant: bf16
    evaluation_mode: modeled
    pricing:
      input_per_1m: null
      output_per_1m: null
    deployment:
      region_processing: {value: "India (operator-chosen region)", unit: region, provenance: modeled, source: "design assumption: operator deploys in an India-region GPU instance", formula: "region is a deployment choice, not validated by this project", retrieved_at: "2026-11-22T13:30:00+05:30"}
      retention_days: {value: 0, unit: days, provenance: modeled, source: "design assumption: vLLM configured not to persist prompts or outputs", formula: "retention is operator-enforced, not validated by this project", retrieved_at: "2026-11-22T13:30:00+05:30"}
