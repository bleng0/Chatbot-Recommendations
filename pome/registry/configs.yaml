      input_per_1m: null
      output_per_1m: null
    deployment:
      region_processing: null
      retention_days: null
      commercial_use: &apache {value: true, unit: bool, provenance: vendor-doc, source: "https://opensource.googleblog.com/2026/03/gemma-4-expanding-the-gemmaverse-with-apache-20.html", retrieved_at: "2026-11-22T13:30:00+05:30"}
