    retention_days: {value: 30, unit: days, provenance: vendor-doc, source: "https://privacy.claude.com/en/articles/7996866-how-long-do-you-store-my-organizations-data"}
    commercial_use: {value: true, unit: bool, provenance: vendor-doc, source: "https://www.anthropic.com/legal/commercial-terms"}
  sonnet55-api-global: *anthropic
  gem35f-vertex-global:
    region:   {value: "global endpoint (no residency guarantee)", unit: region, provenance: vendor-doc, source: "https://docs.cloud.google.com/gemini-enterprise-agent-platform/resources/data-residency"}
    retention_days: {value: 1, unit: days, provenance: vendor-doc, source: "https://docs.cloud.google.com/vertex-ai/generative-ai/docs/data-governance"}
    commercial_use: {value: true, unit: bool, provenance: vendor-doc, source: "https://cloud.google.com/terms/service-terms"}
