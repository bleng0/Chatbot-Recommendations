# Throughput ceilings. kind: rpm (published requests/min), rps (published requests/s),
# spend (Gemini Tier 1 spend cap per 10 min / cost per request), concurrency (Little's law).
api_limits:
  gem35fl-api-global:        {kind: spend, usd_per_10min: 10, url: "https://ai.google.dev/gemini-api/docs/rate-limits"}
  gem25f-api-global:         {kind: spend, usd_per_10min: 10, url: "https://ai.google.dev/gemini-api/docs/rate-limits"}
  gem35f-vertex-global:      {kind: spend, usd_per_10min: 10, url: "https://ai.google.dev/gemini-api/docs/rate-limits", note: "Vertex publishes no fixed per-project cap (dynamic shared quota); proxy = Gemini API Tier 1 spend cap"}
  gemma4-26b-api-global:     {kind: rpm, value: 20, url: "https://openrouter.ai/docs/api/reference/limits", note: "free tier only; proxy = OpenRouter free-model limit for the same Google backend"}
  gpt54nano-api-global:      {kind: rpm, value: 500, url: "https://developers.openai.com/api/docs/models/gpt-5.4-mini", note: "Tier 1; nano table not readable, proxy = gpt-5.4-mini Tier 1"}
  gpt54mini-api-global:      {kind: rpm, value: 500, url: "https://developers.openai.com/api/docs/models/gpt-5.4-mini", note: "Tier 1"}
  haiku55-api-global:        {kind: rpm, value: 1000, url: "https://platform.claude.com/docs/api/rate-limits", note: "start tier"}
  sonnet55-api-global:       {kind: rpm, value: 1000, url: "https://platform.claude.com/docs/api/rate-limits", note: "start tier"}
  mistralsmall4-api-global:  {kind: rps, value: 1, url: "https://help.mistral.ai/en/articles/225174-what-are-the-limits-of-the-free-tier", note: "paid-tier limits are console-only; proxy = published free-tier 1 req/s"}
  sarvam105b-api-in:         {kind: rpm, value: 300, url: "https://docs.sarvam.ai/api/getting-started/pricing", note: "highest published plan"}
  deepseekv41flash-sarvam-in: {kind: rpm, value: 300, url: "https://docs.sarvam.ai/api/getting-started/pricing", note: "highest published plan"}
  deepseekflash-api-global:  {kind: concurrency, value: 2500, url: "https://api-docs.deepseek.com/quick_start/rate_limit"}

# Error rate after retries: 100 - published uptime SLA, else a proxy.
api_error:
  gem35f-vertex-global:      {sla_pct: 99.5, url: "https://cloud.google.com/vertex-ai/generative-ai/sla"}
  gpt54nano-api-global:      {sla_pct: 99.9, url: "https://openai.com/api-scale-tier", note: "Scale Tier SLA; Standard tier has none"}
  gpt54mini-api-global:      {sla_pct: 99.9, url: "https://openai.com/api-scale-tier", note: "Scale Tier SLA; Standard tier has none"}
  mistralsmall4-api-global:  {sla_pct: 99.5, url: "https://docs.mistral.ai/inference/priority-tier", note: "Priority Tier SLA"}
error_proxy:               # providers with no published SLA: 95% upper bound of POME's own error share
  anchor: gem25f-api-global
  z: 1.96

# Self-hosted decode model (docs/research/evidence-plan.md section B), 1x A100 80GB bf16.
selfhost:
  gpu_bw_tbps: 1.935          # A100 80GB PCIe (NC24ads_A100_v4 is the PCIe card)
  gpu_bw_url: "https://www.nvidia.com/en-us/data-center/a100/"
  eta: 0.7
  ttft_s: 0.2
  concurrency: 32
  vm_sla_pct: 99.9
  vm_sla_url: "https://www.microsoft.com/licensing/docs/view/Service-Level-Agreements-SLA-for-Online-Services"
  proxy_of:                  # laptop quality config: serving modeled as its bf16 deployment
    gemma4-12b-ollama-local-q4: gemma4-12b-vllm-in-bf16
  params_b:
    gemma4-12b-vllm-in-bf16: 12.0
    gemma4-12b-ollama-local-q4: 12.0
    gemma4-31b-vllm-in-bf16: 30.7
    gemma4-26b-vllm-in-bf16: 25.2
    qwen38-27b-vllm-in-bf16: 27.0
    llama31-8b-vllm-in-bf16: 8.03
    sarvam30b-vllm-in-bf16: 32.0
    museglimmer30b-vllm-in-bf16: 29.6

# Monthly cost for configs with no paid price of their own.
price_proxy:               # same weights at another host's published price
  gemma4-26b-api-global: {in: 0.15, out: 0.60, url: "https://cloud.google.com/vertex-ai/generative-ai/pricing", note: "Vertex AI Gemma 4 26B price (Gemini API lists free tier only)"}
cost_proxy:                # copy the cost of the deployment it stands for
  gemma4-12b-ollama-local-q4: gemma4-12b-vllm-in-bf16

