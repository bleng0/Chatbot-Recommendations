# Inputs for values POME did not measure (owner request 2026-11-23: no gate may stay empty).
# Every value built from this file is `vendor-doc` (a URL that states it) or `modeled`
# (a stated formula with the inputs below). None is `measured`. See pome/evidence/gapfill.py.
retrieved_at: "2026-11-23T17:30:00+05:30"
out_tokens: 200            # project workload assumption (same as cost model)
in_tokens: 600

# Quality proxies: POME's own measured runs on the closest measured model.
quality_default_anchor: gemma4-12b-ollama-local-q4   # only config with every quality metric
quality_anchor:            # banking77 only: closest measured model by size/tier
  gem35fl-api-global: gemma4-26b-api-global
  gpt54nano-api-global: gemma4-26b-api-global
  gpt54mini-api-global: gem25f-api-global
  haiku55-api-global: gem25f-api-global
  sonnet55-api-global: gem25f-api-global
  gem35f-vertex-global: gem25f-api-global
  mistralsmall4-api-global: gem25f-api-global
  sarvam105b-api-in: gem25f-api-global
  deepseekflash-api-global: gem25f-api-global
  deepseekv41flash-sarvam-in: gem25f-api-global
  gemma4-31b-vllm-in-bf16: gemma4-26b-api-global
  gemma4-26b-vllm-in-bf16: gemma4-26b-api-global
  qwen38-27b-vllm-in-bf16: gemma4-26b-api-global
  sarvam30b-vllm-in-bf16: gemma4-26b-api-global
  museglimmer30b-vllm-in-bf16: gemma4-26b-api-global
  llama31-8b-vllm-in-bf16: gemma4-12b-ollama-local-q4

