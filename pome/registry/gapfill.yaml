    region:   {value: "global (regional processing is an opt-in endpoint)", unit: region, provenance: vendor-doc, source: "https://developers.openai.com/api/docs/models/gpt-5.4-nano"}
    retention_days: {value: 30, unit: days, provenance: vendor-doc, source: "https://developers.openai.com/api/docs/guides/your-data"}
    commercial_use: {value: true, unit: bool, provenance: vendor-doc, source: "https://openai.com/policies/services-agreement/"}
  gpt54mini-api-global: *openai
  haiku55-api-global: &anthropic
