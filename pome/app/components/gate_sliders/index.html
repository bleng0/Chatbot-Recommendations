<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<style>
@font-face{font-family:"Fira Sans";font-weight:400;src:url("/app/static/fonts/fira-sans-latin-400-normal.woff2") format("woff2")}
@font-face{font-family:"Fira Sans";font-weight:500;src:url("/app/static/fonts/fira-sans-latin-500-normal.woff2") format("woff2")}
@font-face{font-family:"Fira Sans";font-weight:600;src:url("/app/static/fonts/fira-sans-latin-600-normal.woff2") format("woff2")}
@font-face{font-family:"Fira Code";font-weight:400;src:url("/app/static/fonts/fira-code-latin-400-normal.woff2") format("woff2")}
@font-face{font-family:"Fira Code";font-weight:500;src:url("/app/static/fonts/fira-code-latin-500-normal.woff2") format("woff2")}
html,body{margin:0;background:transparent}
body{font:14px/1.5 "Fira Sans",system-ui,sans-serif;color:#1C1D1F}
tr.sl th{vertical-align:bottom;padding:.5rem .2rem .3rem;border-bottom:1px solid #CDCDCF;font-weight:400;background:#fff}
tr.sl th.lab{text-align:left;padding-left:.75rem;vertical-align:middle}
tr.sl .lt{display:block;font-weight:600;font-size:.8125rem}
tr.sl .ls{display:block;font-size:.75rem;color:#5E6065;max-width:22ch}
.sv{display:flex;flex-direction:column;align-items:center;gap:.15rem}
.sv .v{font:500 12px "Fira Code",ui-monospace,monospace;color:#1C1D1F;white-space:nowrap}
.sv.loose .v{color:#C23A17}
.tk{position:relative;height:96px;width:28px;display:flex;justify-content:center}
.tk input{writing-mode:vertical-lr;direction:rtl;height:96px;width:22px;margin:0;accent-color:#0B7372;cursor:pointer}
.sv.loose input{accent-color:#EC4D25}
.tk input:focus-visible{outline:2px solid #0B7372;outline-offset:2px;border-radius:4px}
.mk{position:absolute;left:0;right:0;height:2px;background:#1C1D1F;pointer-events:none;border-radius:1px}
.sv .o{font:400 11px "Fira Code",ui-monospace,monospace;color:#5E6065;white-space:nowrap}
.sv .x{font-size:11px;color:#C23A17;min-height:1.2em;white-space:nowrap}
.rs{margin-top:.4rem;font:inherit;font-size:.75rem;padding:.2rem .55rem;border:1px solid #CDCDCF;border-radius:6px;background:#fff;cursor:pointer;color:#1C1D1F}
.rs:hover{border-color:#0B7372}
.rs:focus-visible{outline:2px solid #0B7372;outline-offset:2px}
.off-s{font-size:11px;color:#939599}
</style><style id="app"></style></head>
<body><div id="root"></div>
<script>
const send=(type,data)=>window.parent.postMessage(Object.assign({isStreamlitMessage:true,type},data),"*");
const cur={};let specs=[];
const fmt=(sp,v)=>sp.unit==="ms"?`${(v/1000).toLocaleString("en-IN",{maximumFractionDigits:1})}s`
  :sp.unit==="req_per_s"?`${v}/s`:Number(v).toFixed(2);
const loose=(sp,v)=>sp.op===">="?v<sp.official:v>sp.official;
const emit=()=>send("streamlit:setComponentValue",{value:Object.assign({},cur),dataType:"json"});
const height=()=>send("streamlit:setFrameHeight",{height:Math.ceil(document.getElementById("root").getBoundingClientRect().height)+4});
function paint(sp,el){const v=cur[sp.id],l=loose(sp,v);el.classList.toggle("loose",l);
  el.querySelector(".v").textContent=fmt(sp,v);el.querySelector(".x").textContent=l?"looser":"";
  el.querySelector("input").setAttribute("aria-valuetext",`${fmt(sp,v)}${l?", looser than official "+fmt(sp,sp.official):""}`);}
function slider(sp){const el=document.createElement("div");el.className="sv";
  const pct=(sp.official-sp.min)/(sp.max-sp.min)*100;
  el.innerHTML=`<span class="v"></span><div class="tk"><input type="range" min="${sp.min}" max="${sp.max}" step="${sp.step}" value="${cur[sp.id]}" aria-label="${sp.label} threshold" title="Official ${sp.op==='>='?'≥':'≤'} ${fmt(sp,sp.official)}"><span class="mk" style="bottom:calc(${pct}% - 1px)"></span></div><span class="o">${fmt(sp,sp.official)}</span><span class="x"></span>`;
  const inp=el.querySelector("input");
  inp.addEventListener("input",()=>{cur[sp.id]=Number(inp.value);paint(sp,el)});
  inp.addEventListener("change",emit);paint(sp,el);return el;}
function render(args){
  document.getElementById("app").textContent=args.css.replace(/<\/?style>/g,"");
  const root=document.getElementById("root");root.innerHTML=args.table;
  const bySpec=Object.fromEntries(specs.map(s=>[s.id,s]));
  const head=root.querySelector("thead tr");if(!head)return height();
  const row=document.createElement("tr");row.className="sl";
  [...head.children].forEach((th,i)=>{const c=document.createElement("th");
    const g=th.dataset.gate;
    if(i===0){c.className="lab";c.innerHTML=`<span class="lt">Thresholds</span><span class="ls">Black line = official. Coral = looser.</span>`;
      const b=document.createElement("button");b.className="rs";b.type="button";b.textContent="Reset to official";
      b.onclick=()=>{for(const s of specs)cur[s.id]=s.official;render(args);emit()};c.appendChild(b);}
    else if(g&&bySpec[g]&&!th.classList.contains("off"))c.appendChild(slider(bySpec[g]));
    else if(g&&th.classList.contains("off"))c.innerHTML='<span class="off-s">off</span>';
    else if(g)c.innerHTML='<span class="off-s">yes/no</span>';
    row.appendChild(c);});
  head.parentNode.insertBefore(row,head);
  height();}
window.addEventListener("message",e=>{const d=e.data;if(!d||d.type!=="streamlit:render")return;
  specs=d.args.gates;for(const s of specs){if(!(s.id in cur))cur[s.id]=(d.args.value||{})[s.id]??s.official;}
  render(d.args);});
new ResizeObserver(height).observe(document.getElementById("root"));
send("streamlit:componentReady",{apiVersion:1});
</script></body></html>
