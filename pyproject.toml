[project]
name = "pome"
version = "0.1.0"
description = "POME Phase 1: LLM decision framework for customer-care model and hosting selection"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "numpy>=2.4.6",
    "pandas>=3.1.1",
    "plotly>=7.1.0",
    "pyarrow>=26.0.1",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "scikit-learn>=1.9.1",
    "streamlit>=1.67.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
